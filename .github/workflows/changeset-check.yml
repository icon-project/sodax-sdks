name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

concurrency:
  group: changeset-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Require a changeset for published packages
    runs-on: ubuntu-latest
    # Escape hatch: add the `no-changeset` label to skip (e.g. a packages change
    # that genuinely needs no release). App/docs/CI-only PRs pass automatically
    # without a label — see the file-scoped check below.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a changeset only when a published package changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Files changed by this PR
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)

          # Did the PR touch any publishable @sodax/* package?
          TOUCHED_PKG=$(echo "$CHANGED" | grep -E '^packages/(types|libs|wallet-sdk-core|sdk|wallet-sdk-react|dapp-kit|skills)/' || true)

          # Did the PR add a changeset file?
          ADDED_CS=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- '.changeset/*.md' | grep -v '/README.md$' || true)

          if [ -n "$TOUCHED_PKG" ] && [ -z "$ADDED_CS" ]; then
            echo "::error::This PR changes a published @sodax/* package but has no changeset."
            echo "Run 'pnpm changeset' and commit the generated .changeset/*.md file."
            echo "If this change genuinely needs no release, add the 'no-changeset' label to skip."
            echo ""
            echo "Published-package files changed:"
            echo "$TOUCHED_PKG"
            exit 1
          fi

          echo "Changeset check passed."
