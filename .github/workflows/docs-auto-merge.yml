name: Docs auto-merge

# pull_request_target, so the classifier and this file are always the copies on the base
# branch: a PR cannot edit its own gate. Head content is only ever read, never executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge:
    name: Docs auto-merge
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # A fork head is out of scope: it can be opened by anyone.
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # By SHA, so a force-push between the event and this fetch fails the step rather than
      # classifying a commit the event did not name.
      - name: Fetch the pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Classify the pull request diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/classify-docs-pr.sh "$BASE_SHA" "$HEAD_SHA"

      # Secrets are not usable in if:; record presence so cleanup is only required when the App can act.
      - name: Record whether App credentials exist
        id: creds-present
        if: ${{ !cancelled() }}
        env:
          APP_ID: ${{ secrets.DOCS_PUBLISH_APP_ID }}
          APP_KEY: ${{ secrets.DOCS_PUBLISH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo 'present=true' >>"$GITHUB_OUTPUT"
          else
            echo 'present=false' >>"$GITHUB_OUTPUT"
          fi

      # Check live metadata even after classification fails, so an earlier approval can be withdrawn.
      - name: Check whether an App token is needed
        id: app-needed
        if: ${{ !cancelled() && steps.creds-present.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKETING_ONLY: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.marketing_only == 'true' }}
          CREDS_PRESENT: ${{ steps.creds-present.outputs.present }}
        run: bash .github/scripts/docs-app-needed.sh "$PR" "$MARKETING_ONLY" "$CREDS_PRESENT"

      # Missing credentials may skip a new approval, but must not silently skip required cleanup.
      - name: Check the App credentials are provisioned
        id: creds
        if: ${{ !cancelled() && steps.app-needed.outcome == 'success' && steps.app-needed.outputs.token_required == 'true' }}
        env:
          APP_ID: ${{ secrets.DOCS_PUBLISH_APP_ID }}
          APP_KEY: ${{ secrets.DOCS_PUBLISH_APP_PRIVATE_KEY }}
          MARKETING_ONLY: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.marketing_only == 'true' }}
        run: |
          set -euo pipefail
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo 'present=true' >>"$GITHUB_OUTPUT"
          else
            echo 'present=false' >>"$GITHUB_OUTPUT"
            if [ "$MARKETING_ONLY" = 'true' ]; then
              echo '::warning::Docs App credentials are unset; skipping auto-approval. A human reviewer is required.'
            else
              echo '::error::Docs App credentials are unset; possible stale approval or queued merge requires cleanup.'
              exit 1
            fi
          fi

      # GITHUB_TOKEN cannot supply a qualifying approval; the App is needed for approval or cleanup.
      - name: Mint an App token
        id: app-token
        if: ${{ !cancelled() && steps.app-needed.outcome == 'success' && steps.app-needed.outputs.token_required == 'true' && steps.creds.outcome == 'success' && steps.creds.outputs.present == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOCS_PUBLISH_APP_ID }}
          private-key: ${{ secrets.DOCS_PUBLISH_APP_PRIVATE_KEY }}

      # Before the approval, so the edit lands while Lint PR can still re-run on it: the squash
      # subject is the PR title, and Mintlify's default title is not a conventional commit.
      - name: Retitle the pull request
        if: steps.classify.outputs.marketing_only == 'true' && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          PAGES: ${{ steps.classify.outputs.pages }}
        run: .github/scripts/retitle-docs-pr.sh "$PR"

      # The same HEAD_SHA the classifier read, so the approval cannot land on a commit a
      # later push put there.
      - name: Approve and queue the merge
        if: steps.classify.outputs.marketing_only == 'true' && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: .github/scripts/approve-docs-pr.sh "$PR" "$HEAD_SHA" "$REASON"

      # Second line to the ruleset's dismiss-on-push: also turns auto-merge off, and covers a
      # PR that stops qualifying, stops touching docs/, or is reopened without a push.
      # Gated on the mint as well: a run with no token approved nothing, and gh would only fail.
      - name: Withdraw a stale approval
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' && (steps.classify.outcome != 'success' || steps.classify.outputs.marketing_only != 'true') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.classify.outputs.reason }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: .github/scripts/withdraw-docs-pr.sh "$PR" "$BOT" "$REASON"
