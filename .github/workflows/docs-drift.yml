name: Docs Drift

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The job only reads the repo; never grant the default (potentially write) token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-drift:
    name: Docs ship with code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always run: a skipped job does not satisfy a required status check.
    # The docs-not-needed label exits 0 inside the job instead of skipping it.
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # Full history: the check diffs against the PR base SHA.
          fetch-depth: 0
          # The drift step runs the PR's version of the check script;
          # keep the token out of .git/config.
          persist-credentials: false

      - name: Check for documentation drift
        # Env indirection: expressions expand before shell parsing, so refs are
        # never interpolated into the script (GitHub script-injection hardening).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "docs-not-needed label present — Docs Drift skipped."
            exit 0
          fi
          bash .github/scripts/check-docs-drift.sh "$BASE_SHA"
