name: Docs Drift

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The job only reads the repo; never grant the default (potentially write) token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-drift:
    name: Docs ship with code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Maintainer-applied escape hatch for PRs with no user-facing change.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # Full history: the check diffs against the PR base branch.
          fetch-depth: 0
          # The drift step runs the PR's version of the check script;
          # keep the token out of .git/config. Anonymous fetch works (public repo).
          persist-credentials: false

      - name: Check for documentation drift
        # Env indirection: expressions expand before shell parsing, so refs are
        # never interpolated into the script (GitHub script-injection hardening).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          bash .github/scripts/check-docs-drift.sh "origin/$BASE_REF"
