name: Lint PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # Title only. The single-commit options guarded `squash_merge_commit_title:
      # COMMIT_OR_PR_TITLE`, under which a lone commit's message became the squash subject;
      # the repository is set to PR_TITLE, so the title checked here is what lands on main.
      - uses: amannn/action-semantic-pull-request@b6bca70dcd3e56e896605356ce09b76f7e1e0d39 # v5.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
