# OSV-Scanner advisory baseline (audit gh-741, secrets-supply-chain:H-3).
# Burn entries down; do not add new ones without triage.
#
# Every entry carries `ignoreUntil`, which osv-scanner enforces: past that date the
# advisory is reported again. Entries fixed upstream but sitting inside the
# minimumReleaseAge cooldown use the date the cooldown lapses; the rest use the
# quarterly re-triage date. An expired entry does not turn `main` red — the push and
# scheduled scans are advisory and report to Code scanning — but it does block a pull
# request that would newly introduce it. Re-triage on expiry; never extend blindly.

